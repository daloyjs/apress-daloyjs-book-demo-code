# Hardened CI for the progressive companion (Chapter 16).
# Shape matches create-daloy --with-ci node template: least-privilege
# permissions, SHA-pinned actions, scripts-off install, no shared package
# manager cache bridging fork PRs.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
          disable-sudo: true
          disable-file-monitoring: false

      - name: Checkout
        # v6.1.0 backports the actions/checkout refusal to fetch fork code
        # under pull_request_target / workflow_run. A SHA pin does not pick
        # that up on its own, so bumping the pin is the deliberate step.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          # Package-manager caching is intentionally disabled. Shared caches
          # can bridge fork PRs into trusted branches when mis-keyed.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_ignore_scripts: "true"

      - name: Verify no lifecycle scripts
        run: pnpm verify:no-lifecycle-scripts

      - name: Verify known dependency names
        run: pnpm verify:known-deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Contract check
        run: pnpm contract

      - name: Audit production deps
        run: pnpm audit --prod
